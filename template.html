<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randomizer5e2024</title>
<style>
:root{--adv:#c0392b;--bg:#e8eef0;--fg:#1c2a33;--card:#fbfdfd;--acc:#0e6670;--gold:#a8741a;--mut:#6b7f8a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--adv:#ff8a7a;--bg:#121c22;--fg:#dbe7ec;--card:#1b2a32;--acc:#5ec4cf;--gold:#e0b050;--mut:#8aa0ab}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Palatino,"Palatino Linotype",Georgia,serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2em;margin:.2em 0 .4em;color:var(--acc)}
h2{font-size:1.15em;margin:0 0 .4em}
.card{background:var(--card);border:1px solid var(--mut);border-radius:12px;padding:16px;margin:14px 0}
button{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:12px 18px;margin:4px 6px 4px 0;cursor:pointer}
button.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--mut);border-radius:6px;padding:8px;width:3.6em;margin:2px 4px 2px 0;box-sizing:border-box}
input.d{width:2.8em;text-align:center}
input.nm{width:100%;font-size:1.6em;font-weight:bold;margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 10px}
dl{margin:10px 0;display:grid;grid-template-columns:7em 1fr;gap:4px}dt{color:var(--mut)}dd{margin:0;font-weight:bold}
.arr{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.die{width:54px;height:54px;border:2px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:bold;color:var(--gold)}
table{border-collapse:collapse;font-size:13px;margin:8px 0 20px}td,th{border:1px solid var(--mut);padding:2px 6px;text-align:left}
.sc{overflow-x:auto}
.adv{color:var(--adv)}
#er{color:#c0392b;margin:0}
.nr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.nr input.nm{width:auto;flex:1;min-width:0;margin:0}button.sm{font-size:.62em;padding:6px 8px;margin:0;line-height:1.2;flex:none}
[hidden]{display:none!important}
#bar{display:flex;margin:0 0 12px;border-bottom:2px solid var(--acc)}#xp{white-space:nowrap}#xp select{font:inherit;padding:4px;border-radius:6px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
#bar select{font:inherit;flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
.tabs{display:flex;align-items:flex-end}
.tab{font:inherit;font-size:.82em;margin:0 4px -2px 0;padding:6px 14px;border:1px solid var(--mut);border-bottom:2px solid var(--acc);border-radius:10px 10px 0 0;background:var(--card);color:var(--mut);cursor:pointer}
.tab.on{font-size:1em;font-weight:bold;padding:9px 20px;background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.sm2{padding:6px 10px;margin:0 4px 0 0;font-size:.85em}

.pn{flex:0 0 100%;scroll-snap-align:start;min-width:0}
@media(min-width:1000px){main{max-width:1200px}#panels{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);overflow:visible}#bar{display:none!important}}
@media print{button{display:none}body{background:#fff;color:#000}.card{border:0}.pb{break-before:page}}
</style></head><body><main><h1>Randomizer5e2024</h1><div id="bar" hidden><span class="tabs"><button id="t1" class="tab on">Character</button><button id="t2" class="tab">Entourage</button></span></div>
<div id="panels"><div id="app" class="pn"></div><div id="ent" class="pn" style="display:none"></div></div><p id="ver" style="color:var(--mut);font-size:12px"></p></main>
<script>
/* Randomizer5e2024 app code. The DATA line is filled in by build.py from the CSV files in /data.
   To change odds, names or sources: edit the CSVs, then run build.py. */
const DATA=/*DATA*/null;
const D=DATA,APP=D.app+" v"+D.version;
const $=i=>document.getElementById(i),app=$("app");
$("ver").textContent=APP;
const rnd=n=>1+Math.floor(Math.random()*n);
// Weights are relative; a d100 roll is scaled across them. Entries are [name, weight, source].
const pick=(t,r)=>{const s=t.reduce((a,x)=>a+x[1],0),x=Math.ceil(r*s/100);let c=0;for(const e of t){c+=e[1];if(x<=c)return e}return t[t.length-1]};
const stamp=t=>APP+" | "+new Date().toISOString()+" | "+t;
let cnt=0,USED=new Set(),NOADV=false,FS={};
function bump(){try{const k="r5e24_gen",n=(+localStorage.getItem(k)||0)+1;localStorage.setItem(k,n);return n}catch(e){return null}}

// ---- Backstory engine (v1.2). Tables come from data/backstory.csv; all rolls are made by the app. ----
const dice=e=>{const m=/^(\d*)d(\d+)([+-]\d+)?$/.exec(e);if(!m)return{t:+e,p:[+e]};const n=+(m[1]||1),s=+m[2],b=+(m[3]||0),p=[];for(let i=0;i<n;i++)p.push(rnd(s));return{t:p.reduce((a,x)=>a+x,0)+b,p}};
function bt(name,lg,mod,label){
 const rows=D.bt[name],ex=D.bd[name],d=dice(ex);mod=mod||0;
 const t=Math.min(Math.max(d.t+mod,rows[0].lo),rows[rows.length-1].hi),r=rows.find(x=>t>=x.lo&&t<=x.hi)||rows[rows.length-1];
 lg.push((label||name)+": "+ex+" = "+d.p.join("+")+(mod?(mod>0?"+":"")+mod:"")+" = "+t+"  -> "+r.txt);
 return r;
}
// Ages are handled in "human-equivalent years" (h) and converted to the species' own years for display.
const HL=()=>D.age.Human[1],IMM=s=>!!(D.age[s]&&D.age[s][2]);
const bsp=c=>c.init?c.init.spn:c.spn,bln=c=>c.init?c.init.lin:c.lin,an=s=>/^[AEIOUaeiou]/.test(s)?"an":"a";
const ageOf=s=>D.age[s]||[18,80,0];
const toYr=(h,s)=>{const a=ageOf(s);return h<18?h/18*a[0]:a[0]+(h-18)/(HL()-18)*(a[1]-a[0])};   // years lived when a creature of species s reaches human-equivalent stage h
const toStage=(R,s)=>{const a=ageOf(s);return R<a[0]?R/a[0]*18:18+(R-a[0])/(a[1]-a[0])*(HL()-18)};
const yps=s=>{const a=ageOf(s);return(a[1]-a[0])/(HL()-18)};   // years per human adult year
const toSp=(h,sp)=>Math.max(1,Math.round(toYr(h,sp)));
const yrs=(c,h)=>c.init&&c.ht!=null?(h<=c.ht?toYr(h,c.init.spn):toYr(c.ht,c.init.spn)+(h-c.ht)*yps(c.spn)):toYr(h,c.spn);
const Rof=p=>p.R!=null?p.R:toYr(p.h,p.spn);
const lab=h=>{if(h<11)return"Child";let b=D.bt.agebracket[0];for(const r of D.bt.agebracket)if(h>=+r.tag.split("-")[0])b=r;return b.txt};
function ageRoll(lg,who){const b=bt("agebracket",lg,0,who+" age bracket"),d=rnd(10),h=+b.tag.split("-")[0]+d-1;lg.push(who+" exact age: 1d10 = "+d+"  -> "+h+" (human-equivalent years)");return{b,h}}
const clsTab=s=>{const t=D.cls.map(c=>[c.n,c.w[s]||0,c.s]);if(!t.some(x=>x[1]>0))t.forEach(x=>x[1]=1);return t};
const classFor=s=>pick(clsTab(s),rnd(100))[0];
const linFor=s=>{const l=D.lin[s]||[];return l.length?pick(l,rnd(100))[0]:""};
const sexFor=()=>pick(D.sex,rnd(100))[0];
const famOf=c=>c.fam||((D.names[bsp(c)].S||[]).length?c.name.split(" ").pop():"");
const anySp=c=>rnd(100)<=50?c.spn:pick(D.species,rnd(100))[0];
function usedInit(c){FS={};USED=new Set([c.name]);if(MAIN&&MAIN.ent)Object.values(allChars()).forEach(r=>{USED.add(r.name);((r.bs&&r.bs.people)||[]).forEach(p=>USED.add(p.name))})}
function nameFor(c,s,sex,share){let n;for(let t=0;t<10;t++){n=nameOnce(c,s,sex,share);if(!USED.has(n))break}return n}
function nameOnce(c,s,sex,share){
 const N=D.names[s],l=sex=="X"?(rnd(2)==1?"F":"M"):sex,L=N[l].length?N[l]:(N[l=="F"?"M":"F"].length?N[l=="F"?"M":"F"]:D.names.Human[l]);let n=L[(rnd(100)-1)%L.length];
 if((N.S||[]).length)n+=" "+(share&&s==bsp(c)&&famOf(c)?famOf(c):share?(FS[s]||(FS[s]=N.S[(rnd(100)-1)%N.S.length])):N.S[(rnd(100)-1)%N.S.length]);
 return n;
}
// One routine builds every secondary character.
function npc(c,rel,o,lg){
 const s=o.spn||c.spn,sex=o.sex||sexFor(),p={rel,spn:s,sex,lin:o.lin!==undefined?o.lin:(s==c.spn?c.lin:linFor(s))};
 p.id=nid();const h0=o.R!=null?null:(o.h!=null?o.h:ageRoll(lg,rel).h);
 const NPCSP=!!(D.npcsp&&D.npcsp.includes(s));
 const tp=(D.turn&&D.turn[s])||0;
 if(tp>0&&!o.share&&o.turnable!==false){const t=rnd(100)<=tp;lg.push(rel+" turned into "+s+"? ("+tp+"% chance): "+(t?"yes":"no"));if(t)p.init=pickInit(s)}
 if(o.R!=null){p.R=o.R;p.h=toStage(p.R,s)}
 else{p.h=h0;if(p.init){const lo=Math.min(p.h,16);p.ht=lo+Math.floor(Math.random()*(p.h-lo+1));p.R=yrs({init:p.init,ht:p.ht,spn:s},p.h)}else p.R=toYr(p.h,s)}
 p.age=Math.max(1,Math.round(p.R));p.lab=lab(p.h);
 p.name=nameFor(c,p.init?p.init.spn:s,sex,o.share);USED.add(p.name);
 if(NPCSP){p.occ="";p.align=bt("alignment",lg,0,rel+" alignment").txt}
 else if(p.h<11&&!o.occ&&!o.adv)p.occ="Child";
 else{
  let adv=null;
  if(NOADV)adv=false;else if(o.adv===true)adv=true;else if(typeof o.adv=="number"){adv=Math.random()<o.adv;lg.push(rel+" adventurer chance "+Math.round(o.adv*100)+"%: "+(adv?"yes":"no"))}
  if(adv===true){p.occ="Adventurer";p.cls=classFor(s);lg.push(rel+" is an adventurer; class ("+s+" table): "+p.cls)}
  else if(o.occ)p.occ=o.occ;
  else{let oc=bt("occupation",lg,0,rel+" occupation"),k=0;
   while(adv===false&&oc.tag=="adventurer"&&k++<30)oc=bt("occupation",lg,0,rel+" occupation (re-roll: not an adventurer)");
   p.occ=oc.txt;if(oc.tag=="adventurer"){p.cls=classFor(s);lg.push(rel+" class ("+s+" table): "+p.cls)}}
  p.align=bt("alignment",lg,0,rel+" alignment").txt}
 p.att=o.att||bt("attitude",lg,0,rel+" attitude").txt;
 let st=o.status;
 if(!st){if(p.h>HL()&&!IMM(s))st="Dead (old age)";else{const r=bt("status",lg,0,rel+" status");st=r.tag=="dead"?"Dead":r.tag=="missing"?"Missing":r.txt}}
 if(st=="Dead"){let dc=bt("deathcause",lg,0,rel+" cause of death"),z=0;while(IMM(s)&&/old age/i.test(dc.txt)&&z++<30)dc=bt("deathcause",lg,0,rel+" cause of death (re-roll)");st="Dead ("+dc.txt+")"}
 p.status=st;return p;
}
const pl=p=>p.name+" - "+p.rel+". "+p.spn+(p.lin?" ("+p.lin+")":"")+(p.init?" [born "+p.init.spn+"]":"")+", "+p.sex+", age "+p.age+" ("+p.lab+"). "+(p.occ?p.occ+(p.cls?" ("+p.cls+")":"")+".":"")+(p.align?" "+p.align+".":"")+" "+p.att+". "+p.status+".";

// ---- Life events (v1.2.1). Tables come from data/events.csv; partner rules use hybrids.csv. ----
const CHAIN={war:"warout",crime:"punishment"};
const HYB=(a,b)=>{const h=(D.hyb||[]).find(x=>(x[0]==a&&x[1]==b)||(x[0]==b&&x[1]==a));return h?h[2]:null};
function events(c,n,lg,ppl,imp,K,lone,TR){
 // Pass 1: roll every event (type, age, result). Pass 2: apply them in time order (people, love rules, gold, notes).
 const ev=[];
 const makes=(k,rs)=>k=="love"||["friend","enemy","important"].includes(k)||rs.some(x=>["friend","enemy","important","died"].includes(x.tag));
 for(let i=1;i<=n;i++){
  let et,k,eh,rs,z=0;
  do{et=bt("eventtype",lg,0,"life event "+i+" type"+(z?" (loner: re-roll)":""));k=et.tag;const lo=k=="love"?Math.min(c.h,16):8;eh=lo+Math.floor(Math.random()*(c.h-lo+1));rs=[];
   if(k!="love"){rs.push(bt(k,lg,0,et.txt+" result"));if(CHAIN[k])rs.push(bt(CHAIN[k],lg,0,CHAIN[k]))}z++}while(false);
  ev.push({et,k,eh,rs});
 }
 if(TR){ev.push({et:{txt:"Transformation"},k:"turn",eh:c.ht!=null?c.ht:Math.min(c.h,16),rs:[TR]})}
 ev.sort((a,b)=>a.eh-b.eh);
 const out=[],parts=[];let loves=0;
 if(K&&K.partners&&K.partners.length){K.partners.forEach(p=>parts.push({p,same:false,diff:false}));loves=1}
 for(const e of ev){
  const et=e.et,age=Math.max(1,Math.round(yrs(c,e.eh))),ei=[],names=[];let text=e.rs.map(x=>x.txt).join(" ");
  for(const x of e.rs){
   if(x.val&&x.tag!="important"){const g=dice(x.val);lg.push("Gold: "+x.val+" = "+g.p.join("+")+" = "+g.t);ei.push("Age "+age+" ("+et.txt+"): gained "+g.t+" gp.")}
   if(x.note)ei.push("Age "+age+" ("+et.txt+"): "+x.note);
  }
  const mk=(rel,o)=>{const p=npc(c,rel,o,lg);ppl.push(p);names.push(p.name+", "+rel.toLowerCase());return p};
  const spx=kind=>{const o=outSp(c,kind);lg.push(kind+" species: "+(o.spn==c.spn?"same":"different ("+o.spn+")")+" ("+oddsOf(kind)+"% same)");return o};
  const r=e.rs[0],tg=r&&r.tag?r.tag.split(",").map(x=>x.trim()):[],t=tg[0],coin=(why)=>{const v=rnd(2)==1;lg.push(why+": "+(v?"yes":"no")+" (coin flip)");return v};
  const acq=(rel,sp)=>mk(rel,Object.assign({adv:0.5},sp?{spn:sp,lin:linFor(sp)}:spx("Important contact")));
  if(tg.includes("Sire"))acq("Sire","Dhampir");if(tg.includes("Hag"))acq("Hag","Hexblood");if(tg.includes("Alpha"))acq("Alpha","Lupin");if(tg.includes("Necromancer"))acq("Necromancer");
  if(t=="friend")mk("Friend",Object.assign({att:"Friendly",adv:true},spx("Friend")));
  else if(t=="enemy")mk("Enemy",Object.assign({att:"Hostile",adv:true},spx("Enemy")));
  else if(t=="important")mk("Important contact",Object.assign({occ:r.val,adv:0.5},spx("Important contact")));
  else if(t=="died")mk("Lost loved one",{status:"Dead",turnable:false});
  else if(e.k=="love"){
   const wed=c.h>=18,cur=()=>parts.filter(x=>!/^Ex/.test(x.p.rel));
   const partner=rel=>{
    const diff=rnd(100)<=1,same=rnd(100)<=2;let s=c.spn;
    if(diff){do s=pick(D.species,rnd(100))[0];while(s==c.spn)}
    const sx=c.sex=="M"?(same?"M":"F"):c.sex=="F"?(same?"F":"M"):(rnd(2)==1?"M":"F");
    lg.push("Partner: "+(diff?"different species ("+s+")":"same species")+", "+(same?"same-sex":"different-sex")+" couple");
    const h=c.h>=18?Math.max(18,c.h+rnd(11)-6):Math.max(11,c.h+rnd(3)-2);
    const p=mk(rel,{spn:s,sex:sx,lin:linFor(s),att:"Friendly",adv:0.5,h});
    const x={p,same,diff};parts.push(x);return x;
   };
   loves++;
   if(loves==1){
    const sp=wed&&coin("First love event: marriage rather than dating");
    partner(sp?"Spouse":"Lover");text=sp?"You fell in love and married.":"You fell in love and started a relationship.";
   }else{
    const child=wed&&cur().length>0&&!(K&&K.kids&&K.kids.length)&&coin("Later love event: a child with a current partner rather than a new lover");
    if(child){
     const x=cur()[rnd(cur().length)-1],cs=x.same?null:childSp(c.spn,x.p.spn);
     if(cs){const kd=mk("Child",{spn:cs,sex:sexFor(),R:Math.max(0.2,c.R-yrs(c,e.eh)),lin:cs==c.spn?c.lin:linFor(cs),share:true});kd.other=x.p.id;text="You had a child with "+x.p.name+"."}
     else{lg.push("No child possible for this couple");text="You and "+x.p.name+" hoped for a child, but this couple could not have one."}
    }else if(cur().length&&coin("New lover kept secret from the current partner")){
     partner("Secret lover");text="You began a secret affair.";
    }else{
     const exs=cur();exs.forEach(x=>{x.p.rel=/Spouse/.test(x.p.rel)?"Ex-spouse":"Ex-lover"});
     const sp=wed&&coin("New partner: marriage rather than dating");
     partner(sp?"Spouse":"Lover");
     text=(exs.length?"You broke up with "+exs.map(x=>x.p.name).join(" and ")+" and ":"You ")+(sp?"married someone new.":"started seeing someone new.");
    }
   }
  }
  out.push({ei,line:"Around age "+age+" ("+et.txt+"): "+text+(names.length?" ["+names.join("; ")+"]":"")});
 }
 out.forEach(x=>imp.push(...x.ei));
 return out.map(x=>x.line);
}
const ordn=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
function sibLine(c,L){
 if(!L.length)return"You are an only child.";
 const older=L.filter(p=>Rof(p)>Rof(c)+0.01).length,tw=L.filter(p=>Math.abs(Rof(p)-Rof(c))<=0.01).length;
 return"You are the "+ordn(older+1)+" of "+(L.length+1)+" children"+(tw==1?", and you have a twin":tw>1?", and you are one of a set of "+(tw==2?"triplets":"multiples"):"")+".";
}
function pickInit(cur){const t=D.species.filter(x=>x[0]!=cur&&!(D.turn&&D.turn[x[0]]>0));const sp=pick(t.length?t:D.species,rnd(100))[0];return{spn:sp,lin:linFor(sp)}}
// What species can a child of this couple be? Rows in offspring.csv; otherwise the couple's own species (same species) or none.
function childSp(a,b){const r=(D.off||[]).filter(x=>(x[0]==a&&x[1]==b)||(x[0]==b&&x[1]==a));if(r.length)return pick(r.map(x=>[x[2],x[3]]),rnd(100))[0];if(D.made&&(D.made.includes(a)||D.made.includes(b)))return null;return a==b?a:null}
const oddsOf=k=>D.odds&&D.odds[k]!=null?D.odds[k]:({Friend:60,Enemy:50,"Important contact":40,Mentor:50}[k]??100);
function outSp(c,kind){
 const pct=oddsOf(kind);let s=c.spn;
 if(rnd(100)>pct){const t=D.species.filter(x=>x[0]!=c.spn);if(t.length)s=pick(t,rnd(100))[0]}
 return{spn:s,lin:linFor(s)};
}
function brk(h){let b=D.bt.agebracket[0];for(const r of D.bt.agebracket)if(h>=+r.tag.split("-")[0])b=r;return b}
// c = the character (main toon or a developed entourage member). inh = inherited family facts (for siblings).
function backstory(c,inh,K,lone){NOADV=!!lone;try{return backstory0(c,inh,K,lone)}finally{NOADV=false}}
function backstory0(c,inh,K,lone){
 usedInit(c);
 const lg=c.lg,ppl=[],B=[],imp=[];lg.push("","--- Backstory: "+stamp("generated")+" ---");
 let a;
 if(c.keep){a={b:brk(c.h),h:c.h};lg.push("Age kept from the sketch: "+c.age+" years ("+a.b.txt+")")}
 else{a=ageRoll(lg,"Character");c.age=toSp(a.h,c.spn)}
 c.h=a.h;c.bracket=a.b.txt;
 if(c.init&&c.ht==null){const lo=Math.min(c.h,16);c.ht=lo+Math.floor(Math.random()*(c.h-lo+1))}
 if(!c.keep||c.R==null){c.R=yrs(c,c.h);c.age=Math.max(1,Math.round(c.R))}
 const ne=dice(a.b.val);lg.push("Number of life events: "+a.b.val+" = "+ne.p.join("+")+" = "+ne.t);
 if(!c.align)c.align=bt("alignment",lg,0,"alignment").txt;
 let TR=null;
 if(c.init)TR=D.bt[c.spn]?bt(c.spn,lg,0,"how you became "+an(c.spn)+" "+c.spn):{txt:"You were turned into "+an(c.spn)+" "+c.spn+".",tag:"",val:"",note:""};
 const amn=!!TR&&(TR.tag||"").split(",").map(x=>x.trim()).includes("Amnesia");
 let F,sibTxt;
 if(inh){
  F=inh.f;ppl.push(...inh.people);
  sibTxt=sibLine(c,inh.sibs);
  lg.push("Family facts inherited from "+inh.from+".");
 }else if(amn){F=null;sibTxt="";lg.push("Amnesia: birth, parents, upbringing and siblings are not generated.")}
 else if((D.made||[]).includes(bsp(c))){
  const mrow=D.par[bsp(c)],me=pick(mrow.map(x=>[x[0],x[2],x[0],x[3]]),rnd(100));
  const ms=me[2]=="Any"?pick(D.species.filter(x=>!(D.made||[]).includes(x[0])),rnd(100))[0]:me[2];
  lg.push("Made, not born: maker's species: "+ms);
  const mk0=npc(c,me[3]||"Maker",{spn:ms,lin:linFor(ms),sex:sexFor(),R:c.R+toYr(18+rnd(12),ms)},lg);ppl.push(mk0);

// Ask for physical dice results. k = how many numbers to enter (1 for a d100, 4 for 4d6).
function ask(sides,k,lab){return new Promise(res=>{
 const cl=sides==100?"":' class="d"';
 app.innerHTML='<div class="card"><h2>Roll '+(++cnt)+'</h2><p><b>'+esc(lab||"")+'</b></p><p>'+(k==1?"Roll a d100.":"Roll 4d6 and enter the four dice.")+'</p>'+('<input type="text" inputmode="numeric" maxlength="'+(sides==100?3:1)+'"'+cl+'>').repeat(k)+'<p><button id="ok">Enter</button></p><p id="er"></p></div>';
 const ins=[...app.querySelectorAll("input")];ins[0].focus();
 if(sides==6)ins.forEach((el,i)=>el.oninput=()=>{if(!/^[1-6]$/.test(el.value)){el.value="";return}(ins[i+1]||$("ok")).focus()});
 $("ok").onclick=()=>{
  const v=ins.map(i=>i.value.trim()),ok=v.every(x=>/^\d+$/.test(x)&&(sides==100?+x<=100:+x>=1&&+x<=sides));
  if(!ok){$("er").textContent="Enter whole numbers from "+(sides==100?"1 to 100 (00 counts as 100)":"1 to "+sides)+".";return}
  res(v.map(x=>+x||sides));};
});}

function INV(r,X){
 const s=X.sex;
 if(r=="Mother"||r=="Father")return s=="F"?"Daughter":s=="M"?"Son":"Child";

 if(r=="Grandparent")return"Grandchild";
 if(/^(Aunt|Uncle)/.test(r))return s=="F"?"Niece":s=="M"?"Nephew":"Niece or nephew";
 if(r=="Mentor")return"Student";

 return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+bx+'" ry="'+by+'" fill="'+(lil?"#d8c4f2":"#fff4b3")+'" stroke="#222" stroke-width="1.5"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">+'+n+' more</text>';
}
const badges=L=>Object.keys(L.hid).map(k=>badge(L.sup[k],L.hid[k],k===L.hmain)).join("");
function nodeSvg(n,p,hid){
 const cur=n.id==W.cur,foc=n.id==W.focus,f=cur?"#d62020":n.dead?"#fff":n.main?"#7a2a8f":n.dev?"#111":"#888",t=n.dead?"#777":f=="#888"?"#000":"#fff";
 const L=[n.spn+(n.lin?" ("+n.lin+")":""),(n.lab||"")+(n.age?" ("+n.age+" yrs)":""),n.cls||"",n.bg?"("+n.bg+")":""].filter(Boolean).map(s=>s.length>26?s.slice(0,25)+"\u2026":s);
 const top=p[1]-(15+11*L.length)/2,x=p[0],nm=n.name+" ("+n.sex+")";
 return '<g class="nd" data-id="'+esc(n.id)+'" style="cursor:pointer"><ellipse cx="'+x+'" cy="'+p[1]+'" rx="'+NW/2+'" ry="'+NH/2+'" fill="'+f+'" stroke="'+(foc?"#e0b050":"#000")+'" stroke-width="'+(foc?4:1.5)+'"/>'
 +'<text text-anchor="middle" fill="'+t+'"><tspan x="'+x+'" y="'+(top+12)+'" font-size="'+(nm.length>20?11:13)+'" font-weight="bold">'+esc(nm)+'</tspan>'
 +L.map((s,i)=>'<tspan x="'+x+'" y="'+(top+13+11*(i+1))+'" font-size="9">'+esc(s)+'</tspan>').join("")+'</text>'
 +'</g>';
}
function renderEnt(){
 const E=$("ent"),bar=$("bar");
 if(!MAIN&&!(W&&W.demo)){W=null;E.style.display="none";bar.hidden=true;return}
 if(!W||!W.demo){const o=W;W=roster();if(o&&o.main===MAIN)["cur","depth","zoom","xl","msg"].forEach(k=>W[k]=o[k])}
 W.depth=W.depth||3;W.zoom=W.zoom||1;
 if(!W.ch.some(n=>n.id==W.cur))W.cur=W.ch[0].id;
 W.focus=W.cur;
 const on=W.ch.length>1;
 E.style.display=on?"":"none";bar.hidden=!on;
 if(!on)return;
 const old=$("mp"),sl=old?old.scrollLeft:0,st=old?old.scrollTop:0;
 const L=layout(W,W.focus,W.depth),vis=new Set(L.order),by={};W.ch.forEach(n=>by[n.id]=n);
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;L.order.forEach(u=>{const p=L.pos[u];x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 x0-=NW/2+70;x1+=NW/2+70;y0-=NH/2+70;y1+=NH/2+70;
 const edges=planEdges(L,W);
 const nodes=L.order.map(u=>nodeSvg(by[u],L.pos[u],0)).join("")+badges(L);
 const ctrl='<div class="nr" style="flex-wrap:wrap"><select id="cur" aria-label="Playable character" style="flex:1;min-width:0;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)">'+W.ch.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(n=>'<option value="'+esc(n.id)+'"'+(n.id==W.cur?" selected":"")+'>'+esc(n.name)+' ('+esc(n.cls||"")+', '+esc(n.spn)+(n.age?', '+n.age:"")+')</option>').join("")+'</select><span id="xp">Expand <select id="xl">'+[1,2,3,4].map(d=>'<option'+(d==(W.xl||2)?" selected":"")+'>'+d+'</option>').join("")+'</select> levels <button id="xb" class="sm2">Go</button></span></div><p class="sub" id="xm">'+esc(W.msg||"")+'</p>';
 const sw=(c,b)=>'<span style="display:inline-block;width:14px;height:10px;background:'+c+';border:1px solid #000;margin:0 4px 0 10px"></span>'+b;
 E.innerHTML='<div class="card">'+ctrl+'<h2>Entourage of '+esc(by[W.cur].name)+'</h2>'
 +'<p class="sub">Rings shown: <select id="rd">'+[2,3,4,5,6,99].map(d=>'<option value="'+d+'"'+(d==W.depth?" selected":"")+'>'+(d==99?"all":d)+'</option>').join("")+'</select> <button id="zo" class="alt sm2">\u2212</button><button id="zi" class="alt sm2">+</button> '+L.order.length+' of '+W.ch.length+' adventurers shown. Tap one to switch to them.</p>'
 +'<div id="mp" class="sc" style="max-height:70vh;border:1px solid var(--mut);border-radius:10px"><svg viewBox="'+x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)+'" style="width:'+W.zoom*100+'%;display:block;font-family:inherit">'+edges+nodes+'</svg></div>'
 +'<p class="sub" style="font-size:12px;margin-top:8px">'+sw("#d62020","Current")+sw("#7a2a8f","Main")+sw("#111","Developed")+sw("#888","Sketch")+sw("#fff","Dead")+'<br>'
 +Object.keys(LCOL).map(k=>'<span style="display:inline-block;width:18px;height:0;border-top:3px solid '+LCOL[k]+';margin:0 4px 0 10px;vertical-align:middle"></span>'+LNAME[k]).join("")+'</p></div>'+statsCard();
 const m=$("mp");m.scrollLeft=sl;m.scrollTop=st;
 $("cur").onchange=e=>{W.cur=e.target.value;if(!W.demo)showChar(W.cur);renderEnt()};
 $("xl").onchange=e=>{W.xl=+e.target.value};
 $("xb").onclick=()=>{if(!MAIN)return;const n=expand(W.xl||2);W.msg=n?"Developed "+n+" character"+(n==1?"":"s")+".":"Nothing to develop within that many levels.";renderEnt();if(W.cur!=="pc")showChar(W.cur)};
 $("rd").onchange=e=>{W.depth=+e.target.value;renderEnt()};
 $("zi").onclick=()=>{W.zoom=Math.min(6,W.zoom*1.4);renderEnt()};
 $("zo").onclick=()=>{W.zoom=Math.max(.5,W.zoom/1.4);renderEnt()};
 E.querySelectorAll("g.nd").forEach(g=>g.onclick=()=>{W.cur=g.getAttribute("data-id");if(!W.demo)showChar(W.cur);renderEnt()});
}
function bindActs(c){
 $("dl").onclick=()=>{const t=out(c),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=(c.name.replace(/[\\/:*?"<>|\s]+/g,"")||"toon")+".txt";a.click()};
 $("cp").onclick=async()=>{$("msg").textContent=(await copy(out(c)))?"Copied":"Copy failed - try Download"};
 $("again").onclick=home;
}
function statsCard(){
 const sp={},cl={},tot=W.ch.length;W.ch.forEach(n=>{sp[n.spn]=(sp[n.spn]||0)+1;cl[n.cls]=(cl[n.cls]||0)+1});
 const row=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,v])=>[esc(k),v,Math.round(100*v/tot)+"%"]);
 return'<div class="card"><h2>Population</h2><p class="sub">'+tot+' adventurers in this entourage.</p><div style="display:flex;gap:16px;flex-wrap:wrap"><div>'+T(["Species","#","%"],row(sp))+'</div><div>'+T(["Class","#","%"],row(cl))+'</div></div></div>';
}
function showChar(id){
 if($("nm")&&MAIN)sync(MAIN);
 if(id==="pc"){show(MAIN);return}
 const rec=allChars()[id],n=W.ch.find(x=>x.id==id),r=rec||n;
 const dl='<dl><dt>Species</dt><dd>'+esc(r.spn+(r.lin?" ("+r.lin+")":""))+'</dd><dt>Class</dt><dd>'+esc(r.cls)+'</dd>'+(rec?'<dt>Origin</dt><dd>'+esc(rec.bg)+'</dd>':"")+'<dt>Alignment</dt><dd>'+esc(r.align||"")+'</dd><dt>Age</dt><dd>'+r.age+' ('+esc(rec?rec.bracket:r.lab)+')</dd></dl>';
 let h='<div class="card"><h2>'+esc(r.name)+' ('+esc(r.sex)+')</h2>'+dl;
 if(rec){
  h+='<div>Random array</div><div class="arr">'+rec.arr.map(x=>'<div class="die">'+x+'</div>').join("")+'</div></div>'
  +'<div class="card"><h2>Biography</h2><div style="white-space:pre-wrap">'+esc(rec.bs.bio)+'</div></div><div class="card"><h2>People you know</h2>'+rec.bs.people.map(p=>'<p>'+plh(p)+'</p>').join("")+'</div>'
  +'<div class="card"><h2>Effects on your character sheet</h2><p class="sub">'+(rec.bs.imp.length?rec.bs.imp.map(esc).join("<br>"):"Nothing from life events.")+'</p></div>';
 }else{
  h+='<p class="sub">A sketch. Develop it to roll an origin, a random array and a backstory.</p><button id="dv">Develop this character</button> <button id="dvl" class="alt sm2" title="Roll a backstory that creates no new adventurers">Develop as loner</button></div>';
 }
 app.innerHTML=h+'<button id="bk" class="alt">Back to '+esc(MAIN.name)+'</button><div style="margin-top:6px"><button id="dl" class="alt">Download log</button><button id="cp" class="alt">Copy log</button><button id="again">New character</button> <span id="msg" class="sub"></span></div>';
 bindActs(MAIN);
 const dv=$("dv");if(dv)dv.onclick=()=>{develop(id,owner(id));showChar(id);renderEnt()};
 const dvl=$("dvl");if(dvl)dvl.onclick=()=>{develop(id,owner(id),true);showChar(id);renderEnt()};
 $("bk").onclick=()=>{W.cur="pc";showChar("pc");renderEnt()};
}

// Hidden test view: open the page with #demo to see a made-up entourage of 28 adventurers.
function demo(){
 MAIN=null;const N=[],lk=[],ty=["fam","fam","friend","friend","enemy","acq","love"];
 for(let i=0;i<28;i++){const spn=pick(D.species,rnd(100))[0],sex=sexFor(),h=18+rnd(40);
  N.push({id:"d"+i,name:nameFor({spn:"",name:"",fam:""},spn,sex,false),spn,lin:linFor(spn),sex,cls:classFor(spn),age:toSp(h,spn),lab:lab(h),bg:pick(D.bg,rnd(100))[0],dead:rnd(100)<=8,dev:rnd(100)<=60,main:i==0})}
 for(let i=1;i<N.length;i++){const p=i<6?0:Math.floor(Math.random()*i),t=ty[rnd(ty.length)-1];lk.push({a:N[p].id,b:N[i].id,t,rel:LNAME[t]})}
 for(let k=0;k<6;k++){const a=rnd(28)-1,b=rnd(28)-1,t=ty[rnd(ty.length)-1];if(a!=b)lk.push({a:N[a].id,b:N[b].id,t,rel:LNAME[t]})}
 W={ch:N,lk,demo:true,cur:"d0",focus:"d0",depth:3,zoom:1};
 app.innerHTML='<div class="card"><h2>Demo entourage</h2><p class="sub">Made-up characters to test the map. Reload the page for a new one.</p></div>';
 renderEnt();
}

H=="#tables"?tables():H=="#names"?names():H=="#demo"?demo():home();
