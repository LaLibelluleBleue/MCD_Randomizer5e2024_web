<style>
:root{--bg:#e8eef0;--fg:#1c2a33;--card:#fbfdfd;--acc:#0e6670;--gold:#a8741a;--mut:#6b7f8a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#121c22;--fg:#dbe7ec;--card:#1b2a32;--acc:#5ec4cf;--gold:#e0b050;--mut:#8aa0ab}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Palatino,"Palatino Linotype",Georgia,serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2em;margin:.2em 0 .4em;color:var(--acc)}
h2{font-size:1.15em;margin:0 0 .4em}
.card{background:var(--card);border:1px solid var(--mut);border-radius:12px;padding:16px;margin:14px 0}
button{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:12px 18px;margin:4px 6px 4px 0;cursor:pointer}
button.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--mut);border-radius:6px;padding:8px;width:3.6em;margin:2px 4px 2px 0;box-sizing:border-box}
input.nm{width:100%;font-size:1.6em;font-weight:bold;margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 10px}
dl{margin:10px 0;display:grid;grid-template-columns:7em 1fr;gap:4px}dt{color:var(--mut)}dd{margin:0;font-weight:bold}
.arr{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.die{width:54px;height:54px;border:2px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:bold;color:var(--gold)}
table{border-collapse:collapse;font-size:13px;margin:8px 0 20px}td,th{border:1px solid var(--mut);padding:2px 6px;text-align:left}
.sc{overflow-x:auto}
#er{color:#c0392b;margin:0}
.nr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.nr input.nm{width:auto;flex:1;min-width:0;margin:0}button.sm{font-size:.62em;padding:6px 8px;margin:0;line-height:1.2;flex:none}
@media print{button{display:none}body{background:#fff;color:#000}.card{border:0}}

const $=i=>document.getElementById(i),app=$("app");
const rnd=n=>1+Math.floor(Math.random()*n);
const pick=(t,r)=>{const s=t.reduce((a,x)=>a+x[1],0),x=Math.ceil(r*s/100);let c=0;for(const e of t){c+=e[1];if(x<=c)return e[0]}return t[t.length-1][0]};
let cnt=0,last=null;

function home(){
 app.innerHTML='<div class="card"><h2>How do you want to roll?</h2><button id="bp">Physical dice</button><button id="bd">Let the app roll</button></div>';
 $("bp").onclick=()=>gen("p");$("bd").onclick=()=>gen("d");
}

function ask(sides,k,msg){return new Promise(res=>{
 app.innerHTML='<div class="card"><h2>Roll '+(++cnt)+'</h2><p>'+msg+'</p>'+'<input type="number" inputmode="numeric">'.repeat(k)+'<p><button id="ok">Enter</button></p><p id="er"></p></div>';
 const ins=[...app.querySelectorAll("input")];ins[0].focus();
 $("ok").onclick=()=>{
  const v=ins.map(i=>+i.value),bad=ins.some((i,j)=>i.value===""||!Number.isInteger(v[j])||(sides==100&&v[j]==0?false:v[j]<1||v[j]>sides));
  if(bad){$("er").textContent="Enter whole numbers from 1 to "+sides+(sides==100?" (00 counts as 100).":".");return}
  res(v.map(x=>x||sides));};
});}

async function gen(mode){
 cnt=0;const raw=[],lg=["TOON ROLL LOG  "+new Date().toISOString(),"Mode: "+(mode=="p"?"physical dice":"app-generated"),""];
 const R=async()=>{const v=mode=="p"?(await ask(100,1,"Roll a d100."))[0]:rnd(100);raw.push(v);return v};
 let r=await R();const sp=SPECIES.find(s=>s.n==pick(SPECIES.map(x=>[x.n,x.p]),r));lg.push("d100 = "+r+"  -> species: "+sp.n);
 let lin="";if(sp.l.length){r=await R();lin=pick(sp.l,r);lg.push("d100 = "+r+"  -> lineage: "+lin)}
 r=await R();const sex=pick(SEX,r);lg.push("d100 = "+r+"  -> sex: "+sex);
 r=await R();const cls=pick(CLASSES.map((c,i)=>[c,GRID[sp.n][i]]),r);lg.push("d100 = "+r+"  -> class ("+sp.n+" table): "+cls);
 r=await R();const bg=pick(BG,r);lg.push("d100 = "+r+"  -> origin: "+bg);
 const arr=[];
 for(let i=0;i<6;i++){
  const d=mode=="p"?await ask(6,4,"Roll 4d6 and enter all four dice."):[rnd(6),rnd(6),rnd(6),rnd(6)];
  raw.push(d.join(""));const s=[...d].sort((a,b)=>a-b);arr.push(s[1]+s[2]+s[3]);
  lg.push("4d6 = "+d.join(", ")+"  drop "+s[0]+"  -> "+arr[i]);
 }
 arr.sort((a,b)=>b-a);
 last={sp,lin,cls,bg,arr,sex,lg,code:raw.join("-")};
 last.name=newName(sp.n,sex,lg);
 show();
}

function newName(spn,sex,lg){
 const N=NAMES[spn];let lst=sex;
 if(sex=="X"){const t=rnd(100);lst=t<=50?"F":"M";lg.push("App d100 = "+t+"  -> name list for X: "+lst)}
 const a=rnd(100),f=N[lst][(a-1)%N[lst].length];lg.push("App d100 = "+a+"  -> first name: "+f);
 let nm=f;
 if(N.S.length){const b=rnd(100),s=N.S[(b-1)%N.S.length];lg.push("App d100 = "+b+"  -> family/clan name: "+s);nm+=" "+s}
 return nm;
}

function show(){
 const c=last;
 app.innerHTML='<div class="card"><div class="nr"><input id="nm" class="nm" aria-label="Name"><button id="rn" class="alt sm">Random<br>rename</button></div>'
 +'<dl><dt>Species</dt><dd>'+c.sp.n+(c.lin?" ("+c.lin+")":"")+'</dd><dt>Class</dt><dd>'+c.cls+'</dd><dt>Origin</dt><dd>'+c.bg+'</dd><dt>Sex</dt><dd>'+c.sex+'</dd></dl>'
 +'<div>Ability scores</div><div class="arr">'+c.arr.map(x=>'<div class="die">'+x+'</div>').join("")+'</div></div>'
 +'<button id="dl" class="alt">Download roll log</button><button id="again">New character</button>';
 $("nm").value=c.name;
 $("rn").onclick=()=>{c.lg.push("(name re-rolled)");c.name=newName(c.sp.n,c.sex,c.lg);$("nm").value=c.name};
 $("dl").onclick=()=>{
  const t=c.lg.join("\n")+"\n\nROLL CODE: "+c.code+"\n\nFINAL CHARACTER\nName: "+$("nm").value+" ("+c.sex+")\nSpecies: "+c.sp.n+(c.lin?" ("+c.lin+")":"")+"\nClass: "+c.cls+"\nOrigin: "+c.bg+"\nAbility array: "+c.arr.join(", ")+"\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=($("nm").value.replace(/[\\/:*?"<>|\s]+/g,"")||"toon")+".txt";a.click();};
 $("again").onclick=home;
}

// DM print view: open this page with #tables on the end of the address
function tables(){
 const T=(h,rows)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join("")+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</table>';
 const sp=SPECIES.map(s=>[s.n,s.p+"%",s.l.map(l=>l[0]+" "+l[1]+"%").join(", ")]);
 const gr=CLASSES.map((c,i)=>[c].concat(SPECIES.map(s=>GRID[s.n][i])));
 app.innerHTML='<button onclick="window.print()">Print / save as PDF</button><h2>Species and lineages (d100)</h2>'+T(["Species","Chance","Lineage (d100)"],sp)
 +'<h2>Class by species (d100)</h2><div class="sc">'+T(["Class"].concat(SPECIES.map(s=>s.n.slice(0,4))),gr)+'</div>'
 +'<h2>Origin (d100)</h2>'+T(["Origin","Chance"],BG.map(b=>[b[0],b[1]+"%"]))
