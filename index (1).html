function backstory(c,inh,K,lone){
 usedInit(c);
 const lg=c.lg,ppl=[],B=[],imp=[];lg.push("","--- Backstory: "+stamp("generated")+" ---");
 let a;
 if(c.keep){a={b:brk(c.h),h:c.h};lg.push("Age kept from the sketch: "+c.age+" years ("+a.b.txt+")")}

 c.h=a.h;c.bracket=a.b.txt;

 if(!c.align)c.align=bt("alignment",lg,0,"alignment").txt;
 let F,sibTxt;
 if(inh){
  F=inh.f;ppl.push(...inh.people);

 }else{

  if(lone&&!KP){let z=0;while(pr.tag=="known"&&z++<500)pr=bt("parents",lg,0,"parents (loner: re-roll)")}
  const known=pr.tag=="known";
  if(KP)lg.push("Parents already exist in the entourage: "+K.parents.map(p=>p.name).join(" and ")+" (not generated again).");
  let tag="same",ptxt="";const pk="parentage_"+c.spn.toLowerCase();
  if(known&&!KP&&D.bt[pk]){const r=bt(pk,lg,0,"parentage");tag=r.tag;ptxt=" "+r.txt}
  let fm=bt("family",lg,0,"raised by"),n=0;
  while(((!known&&["both","mother","father"].includes(fm.tag))||(KP&&["mother","father"].includes(fm.tag)))&&n++<30)fm=bt("family",lg,0,"raised by (re-roll: parents unknown)");
  if(lone){let z=0;while((KP?["grandparent","relative","mentor"]:["both","mother","father","grandparent","relative","mentor"]).includes(fm.tag)&&z++<500)fm=bt("family",lg,0,"raised by (loner: re-roll)")}
  let ab=null,abw="";
  if(known&&(fm.tag=="mother"||fm.tag=="father")){ab=bt("absent",lg,0,"absent parent");abw=fm.tag=="mother"?"Father":"Mother"}
  if(KP)ppl.push(...K.parents.map(p=>Object.assign({},p)));
  if(known&&!KP){
   const sp=[c.spn,c.spn];if(tag=="human")sp[0]=sp[1]="Human";else if(tag=="mixed")sp[rnd(2)-1]="Human";
   [["Mother","F",sp[0]],["Father","M",sp[1]]].forEach(([rel,sex,s])=>ppl.push(npc(c,rel,{spn:s,sex,h:c.h+17+rnd(14),share:true,lin:s==c.spn?c.lin:"",status:abw==rel?ab.val:null},lg)));
  }
  const kin=fm.tag;
  if(kin=="grandparent")ppl.push(npc(c,"Grandparent",{sex:sexFor(),h:c.h+42+rnd(18),share:true},lg));
  if(kin=="relative"){const sx=sexFor();ppl.push(npc(c,sx=="M"?"Uncle":sx=="F"?"Aunt":"Aunt or uncle",{sex:sx,h:c.h+8+rnd(16),share:true},lg))}
  if(kin=="mentor"){const mo=outSp(c,"Mentor");lg.push("Mentor species: "+(mo.spn==c.spn?"same":"different ("+mo.spn+")"));ppl.push(npc(c,"Mentor",{spn:mo.spn,lin:mo.lin,att:"Friendly"},lg))}
  let sb=KS?{txt:"",val:"0"}:bt("siblings",lg),sn=KS?{p:[0],t:0}:dice(sb.val);const sl=[];
  if(lone&&!KS){let z=0;while(sn.t>0&&z++<500){sb=bt("siblings",lg,0,"siblings (loner: re-roll)");sn=dice(sb.val)}}
  if(!KS)lg.push("Number of siblings: "+sb.val+" = "+sn.p.join("+")+" = "+sn.t);
  if(KS){K.sibs.forEach(p=>{ppl.push(Object.assign({},p));sl.push(p)});lg.push("Siblings already exist in the entourage: "+(sl.length||"none")+" (not generated again).")}
  for(let i=1;i<=sn.t;i++){
   const bo=bt("birthorder",lg,0,"sibling "+i+" birth order"),sx=sexFor();
   const h=bo.tag=="twin"?c.h:bo.tag=="older"?c.h+rnd(6):Math.max(1,c.h-rnd(6));
   const w=sx=="M"?"brother":sx=="F"?"sister":"sibling";
   const p=npc(c,(bo.tag=="twin"?"Twin ":bo.tag=="older"?"Older ":"Younger ")+w,{sex:sx,h,share:true,lin:c.lin},lg);ppl.push(p);sl.push(p);
  }
  const ls=bt("lifestyle",lg),ch=bt("childhome",lg,+ls.val||0,"childhood home");
  F={bp,pr,ptxt,fm,ab,abw,ls,ch};sibTxt=sibLine(c,sl);
 }
 B.push("Age: "+c.age+" ("+c.bracket+").");
 B.push("Birth and parents: "+F.bp.txt+" "+F.pr.txt+F.ptxt);
 B.push("Siblings: "+sibTxt);
 B.push("Upbringing: "+F.fm.txt+(F.ab?" Your "+F.abw.toLowerCase()+" "+F.ab.txt:""));
 B.push("Childhood: "+F.ls.txt+" "+F.ch.txt);
 if(K){ppl.push(...K.kids.map(p=>Object.assign({},p)));ppl.push(...K.partners.map(p=>Object.assign({},p)));if(K.kids.length||K.partners.length)lg.push("Children and partners already exist in the entourage (not generated again).")}
 const ev=events(c,ne.t,lg,ppl,imp,K,lone);
 B.push("Life events:\n"+ev.join("\n"));
 return{bio:B.join("\n\n"),people:ppl,imp,events:ne.t,fam:F};
}

function ask(sides,k,lab){return new Promise(res=>{

});}

const relFor=(kind,e,Xh)=>Object.assign({},e,{rel:kind=="parent"?(e.sex=="F"?"Mother":e.sex=="M"?"Father":"Parent"):kind=="kid"?childWord(e.sex):kind=="partner"?"Spouse":(e.h>Xh?"Older ":e.h<Xh?"Younger ":"Twin ")+sibWord(e.sex)});

   const c=[mx+sg*nx*len*k*2,my+sg*ny*len*k*2],cand={pts:quad(p,c,q,12),d:"M"+p[0]+" "+p[1]+"Q"+c[0]+" "+c[1]+" "+q[0]+" "+q[1],k,curve:1},s=score(cand);
   if(s<bs){bs=s;best=cand}if(cand.h==0&&s<=k)break out}
  if(stats){stats.hits+=best.h;stats.cross+=best.x;stats.edges++;stats.curves+=best.curve}
  segs.push(best.pts);svg.push('<path d="'+best.d+'" fill="none" stroke="'+LCOL[l.t]+'" stroke-width="2.5"/>');
 }
 return svg.join("");
}
function badge(s,n,lil){
 const px=s.pos[0],py=s.pos[1],d=Math.hypot(px,py),ux=d>1?px/d:0,uy=d>1?py/d:1,bx=40,by=12;
 const t=1/Math.sqrt((ux/s.ex)**2+(uy/s.ey)**2),tb=1/Math.sqrt((ux/bx)**2+(uy/by)**2),cx=px+ux*(t+tb+3),cy=py+uy*(t+tb+3);
 return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+bx+'" ry="'+by+'" fill="'+(lil?"#d8c4f2":"#fff4b3")+'" stroke="#222" stroke-width="1.5"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">+'+n+' more</text>';
}
const badges=L=>Object.keys(L.hid).map(k=>badge(L.sup[k],L.hid[k],k===L.hmain)).join("");
function nodeSvg(n,p,hid){
 const cur=n.id==W.cur,foc=n.id==W.focus,f=cur?"#d62020":n.dead?"#fff":n.main?"#7a2a8f":n.dev?"#111":"#888",t=n.dead?"#777":f=="#888"?"#000":"#fff";
 const L=[n.spn+(n.lin?" ("+n.lin+")":""),(n.lab||"")+(n.age?" ("+n.age+" yrs)":""),n.cls||"",n.bg?"("+n.bg+")":""].filter(Boolean).map(s=>s.length>26?s.slice(0,25)+"\u2026":s);
 const top=p[1]-(15+11*L.length)/2,x=p[0],nm=n.name+" ("+n.sex+")";
 return '<g class="nd" data-id="'+esc(n.id)+'" style="cursor:pointer"><ellipse cx="'+x+'" cy="'+p[1]+'" rx="'+NW/2+'" ry="'+NH/2+'" fill="'+f+'" stroke="'+(foc?"#e0b050":"#000")+'" stroke-width="'+(foc?4:1.5)+'"/>'
 +'<text text-anchor="middle" fill="'+t+'"><tspan x="'+x+'" y="'+(top+12)+'" font-size="'+(nm.length>20?11:13)+'" font-weight="bold">'+esc(nm)+'</tspan>'
 +L.map((s,i)=>'<tspan x="'+x+'" y="'+(top+13+11*(i+1))+'" font-size="9">'+esc(s)+'</tspan>').join("")+'</text>'
 +'</g>';
}
function renderEnt(){
 const E=$("ent"),bar=$("bar");
 if(!MAIN&&!(W&&W.demo)){W=null;E.style.display="none";bar.hidden=true;return}
 if(!W||!W.demo){const o=W;W=roster();if(o&&o.main===MAIN)["cur","depth","zoom","xl","msg"].forEach(k=>W[k]=o[k])}
 W.depth=W.depth||3;W.zoom=W.zoom||1;
 if(!W.ch.some(n=>n.id==W.cur))W.cur=W.ch[0].id;
 W.focus=W.cur;
 const on=W.ch.length>1;
 E.style.display=on?"":"none";bar.hidden=!on;
 if(!on)return;
 const old=$("mp"),sl=old?old.scrollLeft:0,st=old?old.scrollTop:0;
 const L=layout(W,W.focus,W.depth),vis=new Set(L.order),by={};W.ch.forEach(n=>by[n.id]=n);
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;L.order.forEach(u=>{const p=L.pos[u];x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 x0-=NW/2+70;x1+=NW/2+70;y0-=NH/2+70;y1+=NH/2+70;
 const edges=planEdges(L,W);
 const nodes=L.order.map(u=>nodeSvg(by[u],L.pos[u],0)).join("")+badges(L);
 const ctrl='<div class="nr" style="flex-wrap:wrap"><select id="cur" aria-label="Playable character" style="flex:1;min-width:0;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)">'+W.ch.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(n=>'<option value="'+esc(n.id)+'"'+(n.id==W.cur?" selected":"")+'>'+esc(n.name)+' ('+esc(n.cls||"")+', '+esc(n.spn)+(n.age?', '+n.age:"")+')</option>').join("")+'</select><span id="xp">Expand <select id="xl">'+[1,2,3,4].map(d=>'<option'+(d==(W.xl||2)?" selected":"")+'>'+d+'</option>').join("")+'</select> levels <button id="xb" class="sm2">Go</button></span></div><p class="sub" id="xm">'+esc(W.msg||"")+'</p>';
 const sw=(c,b)=>'<span style="display:inline-block;width:14px;height:10px;background:'+c+';border:1px solid #000;margin:0 4px 0 10px"></span>'+b;
 E.innerHTML='<div class="card">'+ctrl+'<h2>Entourage of '+esc(by[W.cur].name)+'</h2>'
 +'<p class="sub">Rings shown: <select id="rd">'+[2,3,4,5,6,99].map(d=>'<option value="'+d+'"'+(d==W.depth?" selected":"")+'>'+(d==99?"all":d)+'</option>').join("")+'</select> <button id="zo" class="alt sm2">\u2212</button><button id="zi" class="alt sm2">+</button> '+L.order.length+' of '+W.ch.length+' adventurers shown. Tap one to switch to them.</p>'
 +'<div id="mp" class="sc" style="max-height:70vh;border:1px solid var(--mut);border-radius:10px"><svg viewBox="'+x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)+'" style="width:'+W.zoom*100+'%;display:block;font-family:inherit">'+edges+nodes+'</svg></div>'
 +'<p class="sub" style="font-size:12px;margin-top:8px">'+sw("#d62020","Current")+sw("#7a2a8f","Main")+sw("#111","Developed")+sw("#888","Sketch")+sw("#fff","Dead")+'<br>'
 +Object.keys(LCOL).map(k=>'<span style="display:inline-block;width:18px;height:0;border-top:3px solid '+LCOL[k]+';margin:0 4px 0 10px;vertical-align:middle"></span>'+LNAME[k]).join("")+'</p></div>'+statsCard();
 const m=$("mp");m.scrollLeft=sl;m.scrollTop=st;
 $("cur").onchange=e=>{W.cur=e.target.value;if(!W.demo)showChar(W.cur);renderEnt()};
 $("xl").onchange=e=>{W.xl=+e.target.value};
 $("xb").onclick=()=>{if(!MAIN)return;const n=expand(W.xl||2);W.msg=n?"Developed "+n+" character"+(n==1?"":"s")+".":"Nothing to develop within that many levels.";renderEnt();if(W.cur!=="pc")showChar(W.cur)};
 $("rd").onchange=e=>{W.depth=+e.target.value;renderEnt()};
 $("zi").onclick=()=>{W.zoom=Math.min(6,W.zoom*1.4);renderEnt()};
 $("zo").onclick=()=>{W.zoom=Math.max(.5,W.zoom/1.4);renderEnt()};
 E.querySelectorAll("g.nd").forEach(g=>g.onclick=()=>{W.cur=g.getAttribute("data-id");if(!W.demo)showChar(W.cur);renderEnt()});
}
function bindActs(c){
 $("dl").onclick=()=>{const t=out(c),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=(c.name.replace(/[\\/:*?"<>|\s]+/g,"")||"toon")+".txt";a.click()};

}
function statsCard(){
 const sp={},cl={},tot=W.ch.length;W.ch.forEach(n=>{sp[n.spn]=(sp[n.spn]||0)+1;cl[n.cls]=(cl[n.cls]||0)+1});
 const row=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,v])=>[esc(k),v,Math.round(100*v/tot)+"%"]);
 return'<div class="card"><h2>Population</h2><p class="sub">'+tot+' adventurers in this entourage.</p><div style="display:flex;gap:16px;flex-wrap:wrap"><div>'+T(["Species","#","%"],row(sp))+'</div><div>'+T(["Class","#","%"],row(cl))+'</div></div></div>';
}
function showChar(id){
 if($("nm")&&MAIN)sync(MAIN);
 if(id==="pc"){show(MAIN);return}
 const rec=allChars()[id],n=W.ch.find(x=>x.id==id),r=rec||n;
 const dl='<dl><dt>Species</dt><dd>'+esc(r.spn+(r.lin?" ("+r.lin+")":""))+'</dd><dt>Class</dt><dd>'+esc(r.cls)+'</dd>'+(rec?'<dt>Origin</dt><dd>'+esc(rec.bg)+'</dd>':"")+'<dt>Alignment</dt><dd>'+esc(r.align||"")+'</dd><dt>Age</dt><dd>'+r.age+' ('+esc(rec?rec.bracket:r.lab)+')</dd></dl>';
 let h='<div class="card"><h2>'+esc(r.name)+' ('+esc(r.sex)+')</h2>'+dl;
 if(rec){
  h+='<div>Random array</div><div class="arr">'+rec.arr.map(x=>'<div class="die">'+x+'</div>').join("")+'</div></div>'
  +'<div class="card"><h2>Biography</h2><div style="white-space:pre-wrap">'+esc(rec.bs.bio)+'</div></div><div class="card"><h2>People you know</h2>'+rec.bs.people.map(p=>'<p>'+plh(p)+'</p>').join("")+'</div>'
  +'<div class="card"><h2>Effects on your character sheet</h2><p class="sub">'+(rec.bs.imp.length?rec.bs.imp.map(esc).join("<br>"):"Nothing from life events.")+'</p></div>';
 }else{
  h+='<p class="sub">A sketch. Develop it to roll an origin, a random array and a backstory.</p><button id="dv">Develop this character</button> <button id="dvl" class="alt sm2" title="Roll a backstory that creates no new characters">Develop as loner</button></div>';
 }
 app.innerHTML=h+'<button id="bk" class="alt">Back to '+esc(MAIN.name)+'</button><div style="margin-top:6px"><button id="dl" class="alt">Download log</button><button id="cp" class="alt">Copy log</button><button id="again">New character</button> <span id="msg" class="sub"></span></div>';
 bindActs(MAIN);
 const dv=$("dv");if(dv)dv.onclick=()=>{develop(id,owner(id));showChar(id);renderEnt()};
 const dvl=$("dvl");if(dvl)dvl.onclick=()=>{develop(id,owner(id),true);showChar(id);renderEnt()};
 $("bk").onclick=()=>{W.cur="pc";showChar("pc");renderEnt()};
}
